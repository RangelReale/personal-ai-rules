name: cpp-ci

# C++/Qt/CMake checks: download Qt with the project's setup script, then configure, build and test
# with CMake presets. Tests run through ctest, which sets the offscreen Qt platform. ccache keeps
# compiled objects between runs; only pushes to the default branch save its cache.
on:
  workflow_call:
    inputs:
      matrix:
        description: >-
          JSON list of {os, preset, setup}: the runner, the CMake configure/build/test preset, and
          the command that downloads Qt into .qt/ (or $QT_ROOT). The full matrix.
        type: string
        default: >-
          [
            {"os": "windows-2025", "preset": "windows-ninja", "setup": "pwsh -File scripts/setup.ps1"},
            {"os": "macos-26", "preset": "macos", "setup": "sh scripts/setup.sh"}
          ]
      full:
        description: >-
          'false' runs only quick-matrix (pull requests that change no workflow, toolchain or
          lockfile: the `full` output of changes.yml); anything else runs `matrix`
        type: string
        default: 'true'
      quick-matrix:
        description: >-
          The matrix when full is 'false'. The default needs a `linux` preset; a project without
          one passes its Windows entry instead.
        type: string
        default: '[{"os": "ubuntu-26.04", "preset": "linux", "setup": "sh scripts/setup.sh"}]'
      ccache:
        description: "'false' turns ccache off (it compiles through CMAKE_<LANG>_COMPILER_LAUNCHER)"
        type: string
        default: 'true'
      linux-packages:
        description: apt packages to install on Linux runners (space separated)
        type: string
        default: libgl1-mesa-dev libxkbcommon-dev libxcb-cursor0 ninja-build
      qt-cache-key:
        description: Files whose hash keys the Qt cache (the scripts that pin the Qt version)
        type: string
        default: scripts/setup.*

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.full == 'false' && inputs.quick-matrix || inputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CTEST_PARALLEL_LEVEL: 4
    steps:
      - uses: actions/checkout@v7

      # aqtinstall runs through uvx.
      - uses: astral-sh/setup-uv@v10.3.3

      - name: Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Packages (Linux)
        if: runner.os == 'Linux'
        env:
          PACKAGES: ${{ inputs.linux-packages }}
        run: |
          sudo apt-get update
          # shellcheck disable=SC2086
          sudo apt-get install -y --no-install-recommends $PACKAGES

      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache Qt
        uses: actions/cache@v6
        with:
          path: .qt
          key: qt-${{ runner.os }}-${{ hashFiles(inputs.qt-cache-key) }}

      - name: Download Qt
        run: ${{ matrix.setup }}

      - name: ccache
        if: inputs.ccache != 'false'
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ${{ matrix.os }}-${{ matrix.preset }}
          max-size: 500M
          save: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') }}

      - name: Configure
        shell: bash
        env:
          PRESET: ${{ matrix.preset }}
          CCACHE: ${{ inputs.ccache }}
        run: |
          args=(--preset "$PRESET")
          if [ "$CCACHE" != false ]; then
            args+=(-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache)
          fi
          cmake "${args[@]}"

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}
