name: android-release

# Builds the signed release APK with the tag's version and uploads it as the artifact
# release-android (<repository>-v<version>.apk, or <repository>-<name>-v<version>.apk), for
# release-publish.yml to attach. Works for a standalone app and for an Android component (see
# android-ci.yml for `native` and `pre-build`).
# Gradle reads the version from -PappVersion and the signing config from SIGNING_* variables;
# versionCode is MAJOR*10000 + MINOR*100 + PATCH (see the android skill).
# A debug-signed APK is never published: missing secrets or a debug certificate fail the job.
#
# Secrets, read by name: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
# ANDROID_KEY_PASSWORD. Callers pass `secrets: inherit`. With `environment` set (normally
# `release`), the job runs in that environment and gets its secrets; empty, it uses repository
# secrets. Environment secrets cannot be passed from a caller, which is why the job declares it.
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      name:
        description: Added to the APK name when a repository has more than one app, for example remote
        type: string
        default: ''
      working-directory:
        description: Folder holding gradlew
        type: string
        default: '.'
      java-version:
        type: string
        default: '21'
      gradle-task:
        type: string
        default: assembleRelease
      apk:
        description: The APK Gradle produces, relative to working-directory
        type: string
        default: app/build/outputs/apk/release/app-release.apk
      native:
        description: none, rust or go (see android-ci.yml)
        type: string
        default: none
      rust-targets:
        type: string
        default: aarch64-linux-android x86_64-linux-android
      ndk-version:
        type: string
        default: 28.2.13676358
      pre-build:
        description: Bash run from the repository root before Gradle (the release native library build)
        type: string
        default: ''
      environment:
        description: The GitHub environment holding the signing secrets; empty for repository secrets
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    environment: ${{ inputs.environment }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      - uses: gradle/actions/setup-gradle@v6

      - name: Rust for Android
        if: inputs.native == 'rust'
        env:
          TARGETS: ${{ inputs.rust-targets }}
          NDK_VERSION: ${{ inputs.ndk-version }}
        run: |
          rustup toolchain install --no-self-update
          # shellcheck disable=SC2086
          rustup target add $TARGETS
          cargo install --locked cargo-ndk
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v7
        if: inputs.native == 'go'
        with:
          go-version-file: go.mod

      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            where="repository secrets"
            [ -n "$ENVIRONMENT" ] && where="the secrets of the '$ENVIRONMENT' environment"
            echo "::error::ANDROID_KEYSTORE_BASE64 is missing from $where (and the caller must pass secrets: inherit); a release APK must be signed."
            exit 1
          fi
          umask 077
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Before Gradle
        if: inputs.pre-build != ''
        env:
          PRE_BUILD: ${{ inputs.pre-build }}
          VERSION: ${{ inputs.version }}
        run: bash -euo pipefail -c "$PRE_BUILD"

      - name: Build
        working-directory: ${{ inputs.working-directory }}
        env:
          VERSION: ${{ inputs.version }}
          TASK: ${{ inputs.gradle-task }}
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew "$TASK" "-PappVersion=$VERSION"

      - name: Verify the signature
        env:
          APK: ${{ inputs.working-directory }}/${{ inputs.apk }}
          VERSION: ${{ inputs.version }}
          NAME: ${{ github.event.repository.name }}${{ inputs.name != '' && format('-{0}', inputs.name) || '' }}
        run: |
          set -euo pipefail
          apksigner=$(printf '%s\n' "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          certs=$("$apksigner" verify --print-certs "$APK")
          echo "$certs"
          if grep -q 'CN=Android Debug' <<< "$certs"; then
            echo "::error::The APK is signed with a debug key; check the SIGNING_* config in Gradle."
            exit 1
          fi
          mkdir -p dist
          cp "$APK" "dist/${NAME}-v${VERSION}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: release-android${{ inputs.name != '' && format('-{0}', inputs.name) || '' }}
          path: dist/*.apk
          retention-days: 7

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
