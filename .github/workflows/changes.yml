name: changes

# Classifies a push or pull request, so callers can skip expensive builds:
#   kind=docs     only documentation (*.md, docs/, LICENSE*) changed
#   kind=version  only the project's version and the changelog changed (a release's version change)
#   kind=code     anything else (and always for a first push, a force-push, schedule or dispatch)
# For a repository with components (an Android app in apps/android next to a Rust workspace),
# it also says which parts the code changes touched:
#   main=true            code outside every component folder changed (the main language's code)
#   components=[...]     JSON list of the components whose folders have code changes
# A component job usually runs on `main == 'true' || contains(fromJSON(components), '<name>')`,
# since components build on the main code.
# A job-level `if` keeps the required check reporting, unlike workflow `paths-ignore`.
on:
  workflow_call:
    inputs:
      version-files:
        description: >-
          Manifests, one per line, that hold the project's version (Cargo.toml, CMakeLists.txt,
          plugin.json, VERSION). A change is version-only when these change only their own version
          line and Cargo.lock only the matching version lines.
        type: string
        default: ''
      components:
        description: >-
          Components, one per line, as "<name>: <folder> [<folder>...]" relative to the repository
          root, for example "android: apps/android".
        type: string
        default: ''
      code-paths:
        description: >-
          Folders, space or newline separated, whose files are code even when they are Markdown
          (for example plugins/ for a plugin made of skills).
        type: string
        default: ''
    outputs:
      kind:
        description: docs, version or code
        value: ${{ jobs.classify.outputs.kind }}
      code:
        description: "'true' unless only docs or version strings changed"
        value: ${{ jobs.classify.outputs.code }}
      main:
        description: "'true' when code outside the component folders changed"
        value: ${{ jobs.classify.outputs.main }}
      components:
        description: JSON list of the components with code changes, for example ["android"]
        value: ${{ jobs.classify.outputs.components }}

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      kind: ${{ steps.classify.outputs.kind }}
      code: ${{ steps.classify.outputs.code }}
      main: ${{ steps.classify.outputs.main }}
      components: ${{ steps.classify.outputs.components }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: classify
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          VERSION_FILES: ${{ inputs.version-files }}
          COMPONENTS: ${{ inputs.components }}
          CODE_PATHS: ${{ inputs.code-paths }}
        run: |
          set -euo pipefail
          # Compare with the pull request's base or the previous tip of the pushed branch. A first
          # push, a force-push, a schedule or a manual run builds everything.
          base=""
          if [ "$EVENT" = pull_request ] || [ "$EVENT" = pull_request_target ]; then
            base="$PR_BASE"
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
              && git cat-file -e "$BEFORE^{commit}" 2>/dev/null && git merge-base --is-ancestor "$BEFORE" HEAD; then
            base="$BEFORE"
          fi
          if [ -n "$base" ] && [ "$(git rev-parse "$base")" = "$(git rev-parse HEAD)" ]; then base=""; fi

          # The component a path belongs to; nothing for the main code.
          component_of() {
            local line name p
            while IFS= read -r line; do
              [ -z "${line//[[:space:]]/}" ] && continue
              name=$(echo "${line%%:*}" | tr -d '[:space:]')
              for p in ${line#*:}; do
                p=${p%/}
                case "$1" in "$p" | "$p"/*) echo "$name"; return ;; esac
              done
            done <<< "$COMPONENTS"
          }
          in_code_paths() {
            local p
            for p in $CODE_PATHS; do
              p=${p%/}
              case "$1" in "$p" | "$p"/*) return 0 ;; esac
            done
            return 1
          }
          # The changed lines (without the +/- marker) of a file.
          changed_lines() {
            git diff -U0 "$base" HEAD -- "$1" | grep -E '^[+-]' | grep -vE '^(\+\+\+|---) ' | cut -c2- || true
          }
          semver='[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?'
          all_components=$(while IFS= read -r line; do
            if [ -n "${line//[[:space:]]/}" ]; then n=${line%%:*}; echo "${n//[[:space:]]/}"; fi
          done <<< "$COMPONENTS")

          kind=code main=true changed=$all_components
          if [ -n "$base" ]; then
            files=$(git diff --name-only "$base" HEAD)
            vfiles=$(printf '%s\n' "$VERSION_FILES" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -v '^$' || true)
            version=0 code=0 main=false changed="" versions=""
            # Manifests: only their own version line may change, e.g. `version = "1.2.0"` under
            # [package], `"version": "1.2.0"`, `VERSION 1.2.0` in project(), or the bare version.
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              grep -qxF -- "$file" <<< "$vfiles" || continue
              lines=$(changed_lines "$file")
              [ -z "$lines" ] && continue
              bad=$(printf '%s\n' "$lines" | grep -vcE "^[[:space:]]*(version[[:space:]]*=[[:space:]]*\"$semver\"|\"version\"[[:space:]]*:[[:space:]]*\"$semver\",?|(project\([^)]*)?VERSION[[:space:]]+$semver.*|$semver)[[:space:]]*\$" || true)
              if grep -qiE 'cmake_minimum_required|rust-version' <<< "$lines"; then bad=1; fi
              if [ "$bad" -gt 0 ]; then code=1 main=true; else
                version=1
                versions=$(printf '%s\n%s' "$versions" "$(printf '%s\n' "$lines" | grep -oE "$semver")")
              fi
            done <<< "$files"
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              if grep -qxF -- "$file" <<< "$vfiles"; then continue; fi
              if [ "${file##*/}" = Cargo.lock ]; then
                # Only `version = "<a version the manifests changed>"` lines.
                lines=$(changed_lines "$file")
                bad=0
                while IFS= read -r l; do
                  [ -z "$l" ] && continue
                  v=$(printf '%s\n' "$l" | sed -nE "s/^version = \"($semver)\"\$/\1/p")
                  if [ -z "$v" ] || ! grep -qxF -- "$v" <<< "$versions"; then bad=1; fi
                done <<< "$lines"
                if [ "$bad" = 1 ]; then code=1 main=true; else version=1; fi
                continue
              fi
              case "$file" in
                CHANGELOG.md | changelog.d/*) version=1; continue ;;
              esac
              if ! in_code_paths "$file"; then
                case "$file" in *.md | docs/* | LICENSE*) continue ;; esac
              fi
              code=1
              c=$(component_of "$file")
              if [ -z "$c" ]; then main=true; else changed=$(printf '%s\n%s' "$changed" "$c"); fi
            done <<< "$files"
            if [ "$code" = 1 ]; then kind=code
            elif [ "$version" = 1 ]; then kind=version
            else kind=docs
            fi
          fi
          if [ "$kind" != code ]; then main=false changed=""; fi
          code=$([ "$kind" = code ] && echo true || echo false)
          components_json=$(printf '%s\n' "$changed" | { grep -v '^$' || true; } | sort -u | jq -R . | jq -sc .)
          {
            echo "kind=$kind"
            echo "code=$code"
            echo "main=$main"
            echo "components=$components_json"
          } >> "$GITHUB_OUTPUT"
          echo "Change kind: $kind; main code: $main; components: $components_json"
