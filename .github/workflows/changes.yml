name: changes

# Classifies a push or pull request, so callers can skip expensive builds:
#   kind=docs     only documentation (*.md, docs/, LICENSE*, changelog.d/) changed
#   kind=version  only version strings and the changelog changed (a release's version change)
#   kind=code     anything else
# A job-level `if` on `code` keeps the required check reporting, unlike workflow `paths-ignore`.
on:
  workflow_call:
    inputs:
      version-files:
        description: >-
          Files, one per line, whose changes count as a version change when every changed line
          mentions "version" (Cargo.toml, CMakeLists.txt, plugin.json, VERSION). Cargo.lock is
          always included.
        type: string
        default: ''
    outputs:
      kind:
        description: docs, version or code
        value: ${{ jobs.classify.outputs.kind }}
      code:
        description: "'true' unless only docs or version strings changed"
        value: ${{ jobs.classify.outputs.code }}

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      kind: ${{ steps.classify.outputs.kind }}
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: classify
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          VERSION_FILES: ${{ inputs.version-files }}
        run: |
          set -euo pipefail
          # Compare with the pull request's base, the previous tip of the pushed branch, or, for a
          # new branch, where it left the default branch. With no usable base, build everything.
          base=""
          if [ "$EVENT" = pull_request ] || [ "$EVENT" = pull_request_target ]; then
            base="$PR_BASE"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
              && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base="$BEFORE"
          else
            base=$(git merge-base "origin/$DEFAULT_BRANCH" HEAD 2>/dev/null || true)
          fi

          kind=code
          if [ -n "$base" ] && [ "$EVENT" != schedule ] && [ "$EVENT" != workflow_dispatch ]; then
            version_files=$(printf '%s\nCargo.lock\n' "$VERSION_FILES" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -v '^$' || true)
            version=0 code=0
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              if [ "${file##*/}" = Cargo.lock ] || printf '%s\n' "$version_files" | grep -qxF -- "$file"; then
                # Every added or removed line must mention a version.
                if git diff -U0 "$base" HEAD -- "$file" | grep -E '^[+-]' | grep -vE '^(\+\+\+|---) ' \
                    | grep -viqE 'version'; then
                  code=1
                else
                  version=1
                fi
                continue
              fi
              case "$file" in
                CHANGELOG.md | changelog.d/*) version=1 ;;
                *.md | docs/* | LICENSE*) ;;
                *) code=1 ;;
              esac
            done < <(git diff --name-only "$base" HEAD)
            if [ "$code" = 1 ]; then kind=code
            elif [ "$version" = 1 ]; then kind=version
            else kind=docs
            fi
          fi
          code=$([ "$kind" = code ] && echo true || echo false)
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Change kind: $kind"
