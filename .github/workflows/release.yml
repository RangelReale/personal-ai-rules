name: Release

# Pushing a tag vX.Y.Z checks that plugin.json holds that version and publishes the GitHub release
# with the CHANGELOG.md section as notes. Project workflows pin the reusable workflows to these tags.
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/release-check.yml
    with:
      version-files: plugins/personal-rules/.claude-plugin/plugin.json

  publish:
    needs: check
    permissions:
      contents: write
    uses: ./.github/workflows/release-publish.yml
    with:
      tag: ${{ needs.check.outputs.tag }}
      version: ${{ needs.check.outputs.version }}
      prerelease: ${{ needs.check.outputs.prerelease }}
      assets: false
