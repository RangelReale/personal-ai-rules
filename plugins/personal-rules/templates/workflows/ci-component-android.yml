# Jobs to add to ci.yml for a component; see the header of ci-<language>.yml.
  # Android component __NAME__ in __PATH__: runs when its folder or the main code changed.
  __NAME__:
    needs: changes
    if: needs.changes.outputs.main == 'true' || contains(fromJSON(needs.changes.outputs.components), '__NAME__')
    uses: RangelReale/personal-ai-rules/.github/workflows/android-ci.yml@__RULES_REF__
    with:
      working-directory: __PATH__
      native: __NATIVE__
      # pre-build: >-
      #   cargo ndk -t arm64-v8a -t x86_64 -P 26 -o __PATH__/app/src/main/jniLibs
      #   build -p <ffi crate> --lib --release
